name: Keep Streamlit awake

on:
  schedule:
    - cron: "23 */4 * * *"
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - .github/workflows/keep-streamlit-awake.yml
      - scripts/keep_streamlit_awake.py

permissions:
  contents: read

concurrency:
  group: keep-streamlit-awake
  cancel-in-progress: true

jobs:
  visit:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install browser
        run: |
          python -m pip install playwright==1.61.0
          python -m playwright install --with-deps chromium

      - name: Visit and verify FishSTOP
        env:
          FISHSTOP_URL: https://fishstop-eml.streamlit.app/
        run: python scripts/keep_streamlit_awake.py

      - name: Upload failure screenshot
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: keep-awake-failure
          path: artifacts/keep-awake-failure.png
          if-no-files-found: ignore
          retention-days: 7
